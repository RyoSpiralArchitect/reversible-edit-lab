[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reversible-edit-lab"
version = "0.2.0"
description = "Auditable ROME/MEMIT write-kernel rollback and active acquisition experiments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/RyoSpiralArchitect/reversible-edit-lab"

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
reversible-edit = "reversible_edit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

